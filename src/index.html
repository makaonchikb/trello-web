<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Vanilla App</title>
  <link rel="stylesheet" href="./scss/app.scss">
  <script src="./js/app.js" type="module"></script>
</head>

<body>
  <section class="trello">
    <div class="trello__header ">
      <h1 class="trello__title ">TRELLO</h1>
      <div class="trello__time">
        <p>time</p>
      </div>
    </div>
    <div class="trello__activity-zone">
      <div class="trello__todo-list">
        <div class="trello__todo-header" id="todo-header">
          <h2 class="list-title">TODO:</h2>
          <p class="todo-count">count</p>
        </div>
        <div class="trello__cards-holder">
          <div class="card">
            <p class="card-title">Title</p>
            <p class="card-description">Description</p>
            <div class="card-info-wrapper">
              <p class="card-user">User:</p>
              <p class="card-time">Time</p>
            </div>
            <div class="card-buttons">
              <button class="card-edit-btn btn btn-primary" type="button">Edit</button>
              <button class="card-start-btn btn btn-primary" type="button">Start todo</button>
              <button class="card-delete-btn btn btn-danger" type="button">Delete</button>
            </div>
          </div>
        </div>
        <button class="todo-button btn btn-primary" type="button">
          Add todo
        </button>
      </div>
      <div class="trello__in-progress-list">
        <div class="trello__todo-header" id="in-progress-header">
          <h2 class="list-title">IN PROGRESS:</h2>
          <p class="in-progress-count">count</p>
        </div>
        <div class="trello__cards-holder">

        </div>
      </div>
      <div class="trello__done-list">
        <div class="trello__todo-header" id="done-header">
          <h2 class="list-title">DONE:</h2>
          <p class="done-count">count</p>
        </div>
        <div class="trello__cards-holder">

        </div>
        <button class="todo-button btn btn-danger" type="button">
          Delete all
        </button>
      </div>
    </div>
  </section>
</body>

</html>
